version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: todolist_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todolist
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
